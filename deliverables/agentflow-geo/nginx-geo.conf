# ============================================================
# AgentFlow：nginx GEO 补丁
# 位置：frontend/nginx.conf，插入到 `location / { try_files ... }` 之前
# 原因：当前的 location / 会把 /llms.txt、/robots.txt、/sitemap.xml 的 404
#       回退成 index.html。AI 爬虫访问这些路径时拿到的是 HTML，
#       解析失败 → 等于这些文件根本不存在。
# ============================================================

    # ---- 必须是真文件，命中不了就 404，不要回退 ----
    location = /llms.txt {
        try_files $uri =404;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        try_files $uri =404;
        default_type text/plain;
        charset utf-8;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        default_type application/xml;
        charset utf-8;
    }

# ------------------------------------------------------------
# 顺带修一处性能问题（可选）：
# 现有配置里 `location = /index.html` 设了 no-store，但响应头显示
# 首页的 cache-control 也带 no-store —— 这是对的（发版必须刷新）。
# 但 /assets/ 已经设置了 immutable，无需再动。
# 如果接入 CDN，建议只缓存 /assets/ 与 llms.txt，首页保持不缓存。
# ------------------------------------------------------------

# 验证方法（部署后）：
#   curl -I http://159.75.21.251:3000/llms.txt    → 200 + text/plain
#   curl -I http://159.75.21.251:3000/sitemap.xml → 200 + application/xml
#   curl -s http://159.75.21.251:3000/llms.txt | head -1   → 应输出 "# AgentFlow"
# 如果拿到的仍是 <!DOCTYPE html>，说明补丁没生效或位置放错。
